name: PR CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emulator-full-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Full emulator tests
    runs-on: ubuntu-24.04
    # Allow dependency compilation while still detecting a stuck emulator test.
    timeout-minutes: 30
    steps:
      - name: Check out pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run debug and release suites
        run: bash .github/scripts/ci.sh
